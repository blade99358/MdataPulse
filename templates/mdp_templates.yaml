        value: wireless
    - uuid: 1d56194dfc1c4c8181ae34046d18eec5
      name: 'Wave: Channel width'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.1.3.1]
