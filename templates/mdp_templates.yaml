  - uuid: f4e7d8fe4d554c8ab3159526f8822b32
    template: MDP PoE Switch SNMP
    name: MDP PoE Switch SNMP
    description: PoE port state (POWER-ETHERNET-MIB). Link together with MDP Network Base SNMP on PoE switches.
    groups:
    - name: Templates/MDP network
    items:
    - uuid: 69d88761edee4a37b7441186678f28eb
      name: 'PoE: Total power consumption'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.105.1.3.1.1.4.1]
      key: poe.power.used
      value_type: FLOAT
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '{$POE.POWER.MULT}'
      delay: 5m
      history: '{$RCA.HISTORY}'
      units: W
      tags:
      - tag: component
        value: poe
    discovery_rules:
    - uuid: ad914cb15abc47209699ec8d31e27e8c
      name: PoE ports discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#POE.ADMIN},1.3.6.1.2.1.105.1.1.1.3]
      key: poe.port.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#POE.ADMIN}'
          value: ^1$
          formulaid: A
      item_prototypes:
      - uuid: ea0dcbb420e148f9acf22cc9f430f2c7
        name: 'PoE port {#SNMPINDEX}: Detection status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.105.1.1.1.6.{#SNMPINDEX}]
        key: poe.port.status[{#SNMPINDEX}]
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |-
            var map = '{$POE.STATUS.MAP}'.split(',');
            for (var i = 0; i < map.length; i++) {
                var kv = map[i].split(':');
                if (kv.length == 2 && kv[0].trim() == value.trim()) return kv[1].trim();
            }
            return value;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
        delay: 1m
        history: '{$RCA.HISTORY}'
        trends: '0'
        valuemap:
          name: pethPsePortDetectionStatus
        description: 3 = deliveringPower. A drop from 3 while the switch stays up = PoE/cable fault on that port.
        tags:
        - tag: component
          value: poe
        - tag: rca
          value: poe
        trigger_prototypes:
        - uuid: a78577419ba54d6cb310fe5b6b1ddf79
          expression: last(/MDP PoE Switch SNMP/poe.port.status[{#SNMPINDEX}],#2)=3 and last(/MDP PoE Switch SNMP/poe.port.status[{#SNMPINDEX}])<>3
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/MDP PoE Switch SNMP/poe.port.status[{#SNMPINDEX}])=3
          name: 'PoE port {#SNMPINDEX}: Stopped delivering power'
          priority: AVERAGE
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
    tags:
    - tag: class
      value: network
    - tag: target
      value: poe
    macros:
    - macro: '{$POE.STATUS.MAP}'
      description: 'Translate non-standard PoE states, from:to pairs. Linksys LGS: 1:2,2:3,3:4,4:1'
    - macro: '{$POE.POWER.MULT}'
      value: '1'
      description: 'Total PoE power multiplier to watts. Linksys LGS reports tenths: 0.1'
    valuemaps:
    - uuid: 95c10386db0349ebab23f342b1439437
      name: pethPsePortDetectionStatus
      mappings:
      - value: '1'
        newvalue: disabled
      - value: '2'
        newvalue: searching
      - value: '3'
        newvalue: deliveringPower
      - value: '4'
        newvalue: fault
      - value: '5'
        newvalue: test
      - value: '6'
        newvalue: otherFault
