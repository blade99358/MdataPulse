      - uuid: 6dd7a5ad8c3f480e85326f370456c496
        name: 'Link to {#PEER}: RX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.8.{#SNMPINDEX}]
