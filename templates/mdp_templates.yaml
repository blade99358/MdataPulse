zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36fa9b24fc214820946d9e1329823346
    name: Templates/MDP network
  - uuid: 3a6df9131b5b4091b794130bc1f598b6
    name: Templates/MDP server
  templates:
  - uuid: 6405b5e0c6ce403b9369f0415dd7f309
    template: MDP Network Base SNMP
    name: MDP Network Base SNMP
    description: 'Common base for all MDP network devices: ping, uptime (for RCA), interfaces.'
    groups:
    - name: Templates/MDP network
    items:
    - uuid: 1e4baf46ea7e4907ae7b5fc412505453
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: '{$ICMP.INTERVAL}'
      history: '{$RCA.HISTORY}'
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: rca
        value: ping
      triggers:
      - uuid: 4e2295b22d7b4d43a5c392c963ffc1d0
        expression: max(/MDP Network Base SNMP/icmpping,{$ICMP.DOWN.TIME})=0
        name: Device unreachable
        priority: AVERAGE
        description: No ICMP reply. Downstream devices depend on this trigger through the parent tag, so only the highest failed device raises a problem.
        tags:
        - tag: scope
          value: availability
        - tag: alarm
          value: unreachable
    - uuid: 94d1d506f3e54fcbb4209b264c15677e
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      delay: '{$ICMP.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
      - tag: rca
        value: loss
      triggers:
      - uuid: 2489912595b04fe9add502ea7f1220cf
        expression: min(/MDP Network Base SNMP/icmppingloss,5m)>{$ICMP.LOSS.WARN} and min(/MDP Network Base SNMP/icmppingloss,5m)<100
        name: High ICMP packet loss
        priority: WARNING
        tags:
        - tag: scope
          value: availability
    - uuid: 95df891e1ad84198bfa4de103adcfe53
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: '{$ICMP.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
      - tag: rca
        value: latency
    - uuid: cf6994bf882e4064acef9abad14585ce
      name: Hardware uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.1.1.0]
      key: system.hw.uptime
      delay: '{$UPTIME.INTERVAL}'
      history: '{$RCA.HISTORY}'
      units: uptime
      description: hrSystemUptime. Used by the RCA script to compute boot time. Devices without it (UniFi) store 0, and the triggers and the RCA script use sysUpTime instead.
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      - tag: rca
        value: uptime
    - uuid: cb993111be7e4134b7f4effb78cc97eb
      name: SNMP agent uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: system.net.uptime
      delay: '{$UPTIME.INTERVAL}'
      history: '{$RCA.HISTORY}'
      units: uptime
      description: sysUpTime. Resets on agent restart as well as on reboot.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
      - tag: rca
        value: uptime
    - uuid: a11f9f0d77534c6d88ada8dd92e324e3
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: system.name
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      inventory_link: NAME
      tags:
      - tag: component
        value: system
    - uuid: 117fc7f7c5f042199f0731edce36c52f
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: system.descr
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      inventory_link: OS
      tags:
      - tag: component
        value: system
    - uuid: ee45189dd39f429a91cfac7263b227aa
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      history: '{$RCA.HISTORY}'
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      - tag: rca
        value: snmp
    discovery_rules:
    - uuid: b08f436b09e04f83a6c13b4c80e74203
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]
      key: net.if.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.MATCHES}'
          formulaid: A
        - macro: '{#IFADMINSTATUS}'
          value: ^1$
          formulaid: B
      item_prototypes:
      - uuid: 3b45797a291445618a9fca9decc2aa74
        name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: net.if.status[ifOperStatus.{#SNMPINDEX}]
        delay: '{$IF.INTERVAL}'
        history: '{$RCA.HISTORY}'
        trends: '0'
        valuemap:
          name: IF-MIB::ifOperStatus
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        - tag: rca
          value: ifstatus
        trigger_prototypes:
        - uuid: c6f3f87760274681be95165a32824d69
          expression: '{$IF.LINKDOWN.ALERT:"{#IFNAME}"}=1 and last(/MDP Network Base SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2 and (last(/MDP Network Base SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/MDP
            Network Base SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))=1'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/MDP Network Base SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2
          name: 'Interface {#IFNAME}({#IFALIAS}): Link down'
          priority: AVERAGE
          manual_close: 'YES'
          description: Alerts only on ports with {$IF.LINKDOWN.ALERT:"<ifname>"}=1 (set it on uplinks), to avoid noise from access ports.
          tags:
          - tag: scope
            value: availability
      - uuid: b8e0f1092c7b42f0ab18c401c3427991
        name: 'Interface {#IFNAME}({#IFALIAS}): Last change'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.9.{#SNMPINDEX}]
        key: net.if.lastchange[ifLastChange.{#SNMPINDEX}]
        delay: '{$IF.INTERVAL}'
        history: '{$RCA.HISTORY}'
        trends: '0'
        units: uptime
        description: sysUpTime at the last status change of this port. A change without an uptime reset = link flap.
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '0.01'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        - tag: rca
          value: iflastchange
      - uuid: 96ef05e3d35441709ac18546b8b6d2a1
        name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]
        key: net.if.speed[ifHighSpeed.{#SNMPINDEX}]
        delay: 5m
        history: '{$RCA.HISTORY}'
        trends: '0'
        units: bps
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 4133ca623292494cbc7b5857dfe90586
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        delay: '{$IF.TRAFFIC.INTERVAL}'
        history: '{$RCA.HISTORY}'
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        - tag: rca
          value: traffic
      - uuid: 32a9f5e839e342afb7853983b6c4a49f
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        delay: '{$IF.TRAFFIC.INTERVAL}'
        history: '{$RCA.HISTORY}'
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        - tag: rca
          value: traffic
      - uuid: 7b3bfcd4691a42639a069baa3404c449
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        delay: '{$IF.TRAFFIC.INTERVAL}'
        history: '{$RCA.HISTORY}'
        preprocessing:
        - type: CHANGE_PER_SECOND
          parameters:
          - ''
        tags:
        - tag: component
          value: network
        - tag: interface
          value: '{#IFNAME}'
        - tag: rca
          value: errors
    macros:
    - macro: '{$ICMP.INTERVAL}'
      value: 1m
    - macro: '{$ICMP.DOWN.TIME}'
      value: 3m
      description: No ping reply for this long = unreachable
    - macro: '{$ICMP.LOSS.WARN}'
      value: '20'
    - macro: '{$CPE.UPTIME.ALERT}'
      value: '0'
      description: 1 = 'CPE uptime below' alarm (set on EP-* hosts)
    - macro: '{$CPE.UPTIME.MIN}'
      value: 7d
      description: CPE uptime below this = alarm
    - macro: '{$UPTIME.INTERVAL}'
      value: 1m
      description: 'Keep at 1m: RCA boot-time accuracy depends on it'
    - macro: '{$IF.INTERVAL}'
      value: 1m
      description: Port status and last change (RCA link flaps)
    - macro: '{$IF.TRAFFIC.INTERVAL}'
      value: 5m
      description: Port traffic and errors (not used by the RCA). 1m = 5x more data
    - macro: '{$RCA.HISTORY}'
      value: 30d
      description: History kept for RCA lookbacks (the global housekeeping override from zbx_data.py policy sets the real period; older readings come from the archive)
    - macro: '{$SNMP.TIMEOUT}'
      value: 5m
    - macro: '{$SNMP.ALERT}'
      value: '1'
      description: 0 = no 'SNMP not responding' alarm (ping-only devices)
    - macro: '{$NET.IF.IFTYPE.MATCHES}'
      value: ^(6|71|117|161)$
    - macro: '{$IF.LINKDOWN.ALERT}'
      value: '0'
      description: Set {$IF.LINKDOWN.ALERT:"<ifname>"}=1 on uplink ports
    tags:
    - tag: class
      value: network
    - tag: target
      value: mdp
    valuemaps:
    - uuid: 625306d4d67046eea3775a4211170f9f
      name: Service state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
    - uuid: e3c2e941bda04523969c5038ffd8a083
      name: zabbix.host.available
      mappings:
      - value: '0'
        newvalue: not available
      - value: '1'
        newvalue: available
      - value: '2'
        newvalue: unknown
    - uuid: d1c56218770349b0bd7989348687939e
      name: IF-MIB::ifOperStatus
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
  - uuid: c74f4ef1623141db8c15f86871b5c2d7
    template: MDP Cambium ePMP SNMP
    name: MDP Cambium ePMP SNMP
    description: Cambium ePMP 4600 / Force 4600C / Force 4625 wireless metrics (CAMBIUM-PMP80211-MIB). Link together with MDP Network Base SNMP.
    groups:
    - name: Templates/MDP network
    items:
    - uuid: 769111b9f7c44e4bae373c5cf4c184b6
      name: 'Wireless: Mode'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.3.8.2.1.0]
      key: wifi.mode
      delay: 10m
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      tags:
      - tag: component
        value: wireless
      valuemap:
        name: ePMP mode
    - uuid: f2ae4b77006f439e80a72f072084af8b
      name: 'Wireless: Frequency'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.3.8.2.18.0]
      key: wifi.frequency
      delay: 10m
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      units: MHz
      tags:
      - tag: component
        value: wireless
    - uuid: c516ff050f0145208de8855e4166d89a
      name: 'Wireless: Connected stations (AP)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.10.0]
      key: wifi.stations
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: stations
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: f108879bd16b4cde93fd1cc3e60cbd41
      name: 'Wireless: Link state (SM)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.16.0]
      key: wifi.link.state
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: linkstate
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
      valuemap:
        name: ePMP link state
    - uuid: 43f6f0f35d6343f4aae4f0e6db0d7a84
      name: 'Wireless: Connected AP (SM)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.8.0]
      key: wifi.link.ssid
      delay: 10m
      history: '{$RCA.HISTORY}'
      value_type: CHAR
      tags:
      - tag: component
        value: wireless
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: 1eca8a74832b40e7b9f0e6de4f6ec495
      name: 'Wireless: Signal (dBm)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.3.0]
      key: wifi.rssi
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: dBm
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: rssi
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: 3234675aee104e13b08644c6aa048764
      name: 'Wireless: SNR (dB)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.18.0]
      key: wifi.snr
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: dB
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: snr
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: c78d6e7539ba4470869b7fc16e811d60
      name: 'Wireless: Weakest station signal (dBm)'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.17713.21.1.2.30.1.4]
      key: wifi.sta.worst
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: dBm
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - |-
          var re = /=\s*[A-Za-z0-9]+:\s*(-?[0-9.]+)/g, m, best = null;
          while ((m = re.exec(value)) !== null) { var v = parseFloat(m[1]); if (best === null || v < best) best = v; }
          if (best === null) throw 'no stations';
          return best;
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: rssi
    - uuid: bba05f56237e403b8657ee34dbba752e
      name: 'Wireless: DL MCS (SM)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.7.0]
      key: wifi.dlmcs
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      tags:
      - tag: component
        value: wireless
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: 336870924e194769b754c256a4660364
      name: 'Wireless: UL MCS (SM)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.6.0]
      key: wifi.ulmcs
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      tags:
      - tag: component
        value: wireless
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    - uuid: bc98fc33140c431d9a1e56249dcb2a1b
      name: 'Wireless: Distance to AP (SM)'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.12.0]
      key: wifi.distance
      delay: 1h
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: km
      tags:
      - tag: component
        value: wireless
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
    discovery_rules:
    - uuid: 5a4bdfcea020492fbb92f5127ecd635c
      name: Connected stations discovery (AP)
      type: SNMP_AGENT
      snmp_oid: discovery[{#STAMAC},1.3.6.1.4.1.17713.21.1.2.30.1.1,{#STAIP},1.3.6.1.4.1.17713.21.1.2.30.1.10]
      key: epmp.sta.discovery
      delay: 10m
      lifetime: 3d
      item_prototypes:
      - uuid: c7fd9d34484441db8092a73ac6775869
        name: 'Station {#STAIP} ({#STAMAC}): DL RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.30.1.5.{#SNMPINDEX}]
        key: wifi.sta.dlrssi[{#SNMPINDEX}]
        delay: '{$WIFI.INTERVAL}'
        history: '{$RCA.HISTORY}'
        value_type: FLOAT
        units: dBm
        tags:
        - tag: component
          value: wireless
      - uuid: 6dbc517b226b47a88da604d2368bb457
        name: 'Station {#STAIP} ({#STAMAC}): UL RSSI'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.30.1.4.{#SNMPINDEX}]
        key: wifi.sta.ulrssi[{#SNMPINDEX}]
        delay: '{$WIFI.INTERVAL}'
        history: '{$RCA.HISTORY}'
        value_type: FLOAT
        units: dBm
        tags:
        - tag: component
          value: wireless
        - tag: rca
          value: rssi
      - uuid: 3f350a8e0da446ba99d068a315574968
        name: 'Station {#STAIP} ({#STAMAC}): DL SNR'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.30.1.7.{#SNMPINDEX}]
        key: wifi.sta.dlsnr[{#SNMPINDEX}]
        delay: '{$WIFI.INTERVAL}'
        history: '{$RCA.HISTORY}'
        value_type: FLOAT
        units: dB
        tags:
        - tag: component
          value: wireless
      - uuid: dfad8c0fe5cd423fb48012b734447f52
        name: 'Station {#STAIP} ({#STAMAC}): UL SNR'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.30.1.6.{#SNMPINDEX}]
        key: wifi.sta.ulsnr[{#SNMPINDEX}]
        delay: '{$WIFI.INTERVAL}'
        history: '{$RCA.HISTORY}'
        value_type: FLOAT
        units: dB
        tags:
        - tag: component
          value: wireless
        - tag: rca
          value: snr
      - uuid: bc9e320213fd40f5a6bc788752172ce7
        name: 'Station {#STAIP} ({#STAMAC}): DL MCS'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.17713.21.1.2.30.1.9.{#SNMPINDEX}]
