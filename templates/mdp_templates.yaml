  - uuid: 3777ce27d9ec4045bf39e7b9a20a8639
    template: MDP Ubiquiti Wave SNMP
    name: MDP Ubiquiti Wave SNMP
    description: Ubiquiti UISP Wave Pro 60 GHz links (airFiber MIB). Link together with MDP Network Base SNMP.
    groups:
    - name: Templates/MDP network
    items:
    - uuid: 70f087dc2ffb46608c04cdb125fd2ab6
      name: 'Wireless: Signal (dBm)'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.4.1.41112.1.11.1.3.1.3]
      key: wifi.rssi
      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: dBm
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - |-
          var m = value.match(/=\s*[A-Za-z0-9]+:\s*(-?[0-9.]+)/);
          if (!m) throw 'no link';
          return m[1];
        error_handler: DISCARD_VALUE
      tags:
      - tag: component
        value: wireless
      - tag: rca
        value: rssi
    - uuid: ff638eed67914b73b739789d21736268
      name: 'Wireless: SNR (dB)'
      type: SNMP_AGENT
