  - uuid: fa411976f2064dcbb2d13008dccc2a4e
    template: MDP LACP Trunk SNMP
    name: MDP LACP Trunk SNMP
    description: |-
      LACP trunks (Eth-Trunk in LACP mode) on Huawei eKit switches. OIDs confirmed by snmpwalk of two
      eKit switches, 2026-10-29.

      The radios inside an LACP trunk cannot be reached reliably (the trunk's hashing sends their management
      packets down the other link), so the trunk is watched here instead. A radio that loses its air link keeps
      its cable up: only the LACP state shows it (dot3adAggPortActorOperState, bits sync/collecting/distributing).
      One SNMP walk a minute feeds every item. A port belongs to a trunk by its LACP admin key; static trunks
      (no LACP) have no ports in the LAG MIB and are not discovered.
      Host macro {$LACP.LABEL:"Eth-Trunk1"} (set by zbx_sites.py sitedown) names what the trunk carries.
    groups:
    - name: Templates/MDP network
    items:
    - uuid: 6a17e00cab2e41ecb179e6c6daf1c7a2
      name: 'LACP: raw table'
      type: SNMP_AGENT
      snmp_oid: walk[1.3.6.1.2.1.31.1.1.1.1,1.3.6.1.2.1.2.2.1.8,1.2.840.10006.300.43.1.1.1.1.6,1.2.840.10006.300.43.1.2.1.1.4,1.2.840.10006.300.43.1.2.1.1.21]
      key: lacp.walk
      delay: 1m
      history: '0'
      trends: '0'
      value_type: TEXT
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |2

          var cols = {'1.3.6.1.2.1.31.1.1.1.1': 'name', '1.3.6.1.2.1.2.2.1.8': 'oper',
                      '1.2.840.10006.300.43.1.1.1.1.6': 'aggkey', '1.2.840.10006.300.43.1.2.1.1.4': 'portkey',
                      '1.2.840.10006.300.43.1.2.1.1.21': 'actor'};
          var t = {name: {}, oper: {}, aggkey: {}, portkey: {}, actor: {}};
          value.split('\n').forEach(function (line) {
              var m = line.match(/^\.?([0-9.]+)\.([0-9]+) = ([A-Za-z0-9-]+): ?(.*)$/);
              if (!m || !cols[m[1]]) return;
              var v = m[4].replace(/^"|"\s*$/g, '').trim();
              if (m[3] === 'Hex-STRING') v = parseInt(v.split(' ')[0], 16);
              else if (m[3] === 'STRING' && cols[m[1]] === 'actor') v = v.length ? v.charCodeAt(0) : 0;
              t[cols[m[1]]][m[2]] = v;
          });
          var out = {aggs: {}, ports: {}};
          Object.keys(t.aggkey).forEach(function (i) {
              out.aggs[i] = {n: t.name[i] || ('trunk ' + i), k: String(t.aggkey[i])};
          });
          Object.keys(t.portkey).forEach(function (i) {
              out.ports[i] = {n: t.name[i] || ('port ' + i), k: String(t.portkey[i]),
                              a: Number(t.actor[i] || 0), o: Number(t.oper[i] || 0)};
          });
          return JSON.stringify(out);
      tags:
      - tag: component
        value: lacp
    discovery_rules:
    - uuid: 93fa4b9431564f29ab81f8e81081b239
      name: LACP trunks discovery
      type: DEPENDENT
      key: lacp.trunk.discovery
      master_item:
        key: lacp.walk
      lifetime: 30d
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - |2-

          var d = JSON.parse(value), out = [];
          Object.keys(d.aggs).forEach(function (i) {
              var n = 0;
              Object.keys(d.ports).forEach(function (p) { if (d.ports[p].k === d.aggs[i].k) n++; });
              if (n) out.push({'{#AGGINDEX}': i, '{#AGGNAME}': d.aggs[i].n, '{#MEMBERS}': n});
          });
          return JSON.stringify(out);
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1h
      item_prototypes:
      - uuid: 0e5b8bcdd4204674be3e4d2cbadfa4d7
        name: 'LACP {#AGGNAME}: links in use'
        type: DEPENDENT
        key: lacp.active[{#AGGINDEX}]
        history: '{$RCA.HISTORY}'
        value_type: UNSIGNED
        master_item:
          key: lacp.walk
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |2-

            var d = JSON.parse(value), agg = d.aggs['{#AGGINDEX}'];
            if (!agg) throw 'trunk {#AGGNAME} is gone';
            var all = [], used = [], idle = [];
            Object.keys(d.ports).forEach(function (i) {
                var p = d.ports[i];
                if (p.k !== agg.k) return;
                all.push(p.n);
                if (p.o === 1 && (p.a & 0x1C) === 0x1C) used.push(p.n); else idle.push(p.n);
            });
            return used.length;
        tags:
        - tag: component
          value: lacp
        - tag: trunk
          value: '{#AGGNAME}'
        - tag: rca
          value: lacp
      - uuid: fbc257efad39487faf80a860e8eb5935
        name: 'LACP {#AGGNAME}: links configured'
        type: DEPENDENT
        key: lacp.members[{#AGGINDEX}]
        history: '{$RCA.HISTORY}'
        value_type: UNSIGNED
        master_item:
          key: lacp.walk
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |2-

            var d = JSON.parse(value), agg = d.aggs['{#AGGINDEX}'];
            if (!agg) throw 'trunk {#AGGNAME} is gone';
            var all = [], used = [], idle = [];
            Object.keys(d.ports).forEach(function (i) {
                var p = d.ports[i];
                if (p.k !== agg.k) return;
                all.push(p.n);
                if (p.o === 1 && (p.a & 0x1C) === 0x1C) used.push(p.n); else idle.push(p.n);
            });
            return all.length;
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
        tags:
        - tag: component
          value: lacp
        - tag: trunk
          value: '{#AGGNAME}'
        - tag: rca
          value: lacp
      - uuid: a040b591745646d8a610270f708f25b9
        name: 'LACP {#AGGNAME}: links not in use'
        type: DEPENDENT
        key: lacp.idle[{#AGGINDEX}]
        history: '{$RCA.HISTORY}'
        value_type: CHAR
        master_item:
          key: lacp.walk
        preprocessing:
        - type: JAVASCRIPT
          parameters:
          - |2-

            var d = JSON.parse(value), agg = d.aggs['{#AGGINDEX}'];
            if (!agg) throw 'trunk {#AGGNAME} is gone';
            var all = [], used = [], idle = [];
            Object.keys(d.ports).forEach(function (i) {
                var p = d.ports[i];
                if (p.k !== agg.k) return;
                all.push(p.n);
                if (p.o === 1 && (p.a & 0x1C) === 0x1C) used.push(p.n); else idle.push(p.n);
            });
            return idle.length ? idle.join(', ') : 'none';
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 15m
        tags:
        - tag: component
          value: lacp
        - tag: trunk
          value: '{#AGGNAME}'
        - tag: rca
          value: lacp
      trigger_prototypes:
      - uuid: 566c9bb7a2364495896c47863a2c8609
        expression: max(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],{$LACP.TIME})<last(/MDP LACP Trunk SNMP/lacp.members[{#AGGINDEX}]) and last(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}])>0 and last(/MDP
          LACP Trunk SNMP/lacp.idle[{#AGGINDEX}])<>"none"
        name: 'LACP {#AGGNAME} degraded: {ITEM.LASTVALUE4} not in use{$LACP.LABEL:"{#AGGNAME}"}'
        priority: AVERAGE
        description: 'One link of the trunk is down (port down, or the radio on it lost its air link: LACP stops using it within 3 s with the fast timer). Traffic runs on the other link, at half the capacity
          and with no spare. Check the radio pair on the port named in the problem.'
        opdata: 'In use: {ITEM.LASTVALUE1}'
        tags:
        - tag: scope
          value: availability
        - tag: alarm
          value: lacp
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: min(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],{$LACP.TIME})=last(/MDP LACP Trunk SNMP/lacp.members[{#AGGINDEX}])
        dependencies:
        - name: 'LACP {#AGGNAME}: all links down{$LACP.LABEL:"{#AGGNAME}"}'
          expression: max(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],{$LACP.TIME})=0
          recovery_expression: last(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}])>0
      - uuid: d48e1dc324b04d7192451e047d71853f
        expression: max(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],{$LACP.TIME})=0
        name: 'LACP {#AGGNAME}: all links down{$LACP.LABEL:"{#AGGNAME}"}'
        priority: HIGH
        description: 'No link of the trunk is in use: everything behind it is cut off. The Site down alarm of that site follows; this is its cause on the near side.'
        opdata: 'In use: {ITEM.LASTVALUE1}'
        tags:
        - tag: scope
          value: availability
        - tag: alarm
          value: lacp
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: last(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}])>0
      - uuid: a2471882960d4ac2b468ccf6704b7c28
        expression: changecount(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],1h)>={$LACP.FLAPS}
        name: 'LACP {#AGGNAME}: links flapping{$LACP.LABEL:"{#AGGNAME}"}'
        priority: WARNING
        description: 'The number of links in use changed {$LACP.FLAPS} or more times in an hour: a radio link that keeps dropping (interference, alignment, power).'
        opdata: 'In use: {ITEM.LASTVALUE1}'
        tags:
        - tag: scope
          value: availability
        - tag: alarm
          value: lacp
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: changecount(/MDP LACP Trunk SNMP/lacp.active[{#AGGINDEX}],1h)=0
    macros:
    - macro: '{$LACP.TIME}'
      value: 2m
      description: a link must stay out this long to alarm
    - macro: '{$LACP.FLAPS}'
      value: '4'
      description: changes per hour that count as flapping
    - macro: '{$LACP.LABEL}'
      description: 'what a trunk carries, per trunk: {$LACP.LABEL:"Eth-Trunk1"} = " (SITE0008 main link)"'
    - macro: '{$RCA.HISTORY}'
      value: 30d
    tags:
    - tag: class
      value: network
    - tag: target
      value: lacp
