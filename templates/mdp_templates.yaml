      delay: '{$WIFI.INTERVAL}'
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: dB
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: DISCARD_VALUE
      - type: JAVASCRIPT
        parameters:
        - |-
          var m = value.match(/=\s*[A-Za-z0-9]+:\s*(-?[0-9.]+)/);
          if (!m) throw 'no link';
          return m[1];
        error_handler: DISCARD_VALUE
