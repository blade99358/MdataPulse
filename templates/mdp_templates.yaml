        value_type: FLOAT
        units: dBm
        tags:
        - tag: component
          value: wireless
        - tag: rca
          value: rssi
        trigger_prototypes:
        - uuid: bd66c4cd2f9f408981f7bf09576b8129
          expression: max(/MDP Ubiquiti Wave SNMP/wifi.ap.rssi[{#SNMPINDEX}],10m)<{$WAVE.RSSI.MIN}
