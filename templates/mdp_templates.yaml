        history: '{$RCA.HISTORY}'
        value_type: FLOAT
        units: dBm
        tags:
        - tag: component
          value: wireless
      - uuid: eb1dc50ed724480287c07895f503562b
        name: 'Link to {#PEER}: Local SNR'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.4.{#SNMPINDEX}]
