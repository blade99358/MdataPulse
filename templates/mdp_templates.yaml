  - uuid: 691642aedad04d72930a91636a9e0834
    template: MDP Site Status
    name: MDP Site Status
    description: |-
      Linked to one host per site ("Site SITExxxx", made by zbx_sites.py sitedown from data/main_links.txt).
      Watches the site's main link and counts how many of the site's devices answer ping, and raises one
      "Site SITExxxx DOWN" problem when the main link is lost and most of the site went with it. The device
      alarms of the site, and the Site down alarms of the sites behind it, depend on it.
      Host macros set by sitedown: {$SITE.CODE}, {$SITE.MAINLINK} (text), {$SITE.CUTOFF} (text).
    groups:
    - name: Templates/MDP network
    items:
    - uuid: cadd6e0bb168406b9254c712a390cc05
      name: Devices monitored
      type: CALCULATED
      key: site.devices
      delay: 30s
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      params: count(last_foreach(/*/icmpping?[group="Sites/{$SITE.CODE}"]))
      tags:
      - tag: component
        value: site
    - uuid: 28e0aa9f017d46e89b56e5a10f8eb75c
      name: Devices down
      type: CALCULATED
      key: site.devices.down
      delay: 30s
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      params: count(last_foreach(/*/icmpping?[group="Sites/{$SITE.CODE}"]),"eq",0)
      tags:
      - tag: component
        value: site
    - uuid: 9572418281f34d1bb739b76f135ac09d
      name: Devices down %
      type: CALCULATED
      key: site.devices.down.pct
      delay: 30s
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      units: '%'
      params: last(//site.devices.down)*100/max(last(//site.devices),1)
      tags:
      - tag: component
        value: site
    - uuid: 2d94829406204eb382ea7c6847f960a6
      name: Main link up
      type: CALCULATED
      key: site.mainlink.up
      delay: 30s
      history: '{$RCA.HISTORY}'
      value_type: FLOAT
      params: max(max_foreach(/*/icmpping?[tag="mainlink:{$SITE.CODE}"],{$SITE.DOWN.TIME}))
      description: '1 while any far-end radio of the main link (host tag mainlink=<site>) answered ping in the last {$SITE.DOWN.TIME}. Two radios = LACP: the link is down only when both are.'
      tags:
      - tag: component
        value: site
      valuemap:
        name: Link state
    - uuid: 7c620b80db134aa6a7ecf52757e28248
      name: Upstream site main link down
      type: CALCULATED
      key: site.upstream.down
      delay: 30s
      history: '{$RCA.HISTORY}'
      value_type: UNSIGNED
      params: count(last_foreach(/*/site.mainlink.up?[tag="sitedown:{$SITE.UPSTREAM}" or tag="sitedown:{$SITE.CODE}"]),"eq",0)-(last(//site.mainlink.up)=0)
      description: 1 while the main link of the upstream site ({$SITE.UPSTREAM}, host 'Site <upstream>') is down.
      tags:
      - tag: component
        value: site
    valuemaps:
    - uuid: fc51b64a9a5d4f748d7a03650f983d0f
      name: Link state
      mappings:
      - value: '0'
        newvalue: Down
      - value: '1'
        newvalue: Up
    macros:
    - macro: '{$SITE.CODE}'
      description: Site code, e.g. SITE0007 (set per host)
    - macro: '{$SITE.MAINLINK}'
      description: Main link text for the alarm (set per host)
    - macro: '{$SITE.CUTOFF}'
      description: '''. Also cut off: ...'' sites behind this one'
    - macro: '{$SITE.UPSTREAM}'
      description: Site this one hangs off (set per host)
    - macro: '{$SITE.DISASTER}'
      value: '0'
      description: 1 = Site DOWN is Disaster, 0 = High (set per host)
    - macro: '{$SITE.DOWN.TIME}'
      value: 2m
      description: Main link silent this long = site down. Keep below {$ICMP.DOWN.TIME} (3m)
    - macro: '{$SITE.DOWN.PCT}'
      value: '80'
      description: '% of the site''s devices that must be down too'
    - macro: '{$RCA.HISTORY}'
      value: 30d
    tags:
    - tag: class
      value: site
  triggers:
  - uuid: 42a76cdad1c84b43ba3fda595a2a3a52
    expression: (last(/MDP Network Base SNMP/system.hw.uptime)>0 and last(/MDP Network Base SNMP/system.hw.uptime)<10m) or (last(/MDP Network Base SNMP/system.hw.uptime)=0 and last(/MDP Network Base SNMP/system.net.uptime)<10m)
    name: Device rebooted (uptime below 10m)
    priority: WARNING
    description: 'Uptime reset: power loss, PoE loss or crash. See the RCA report for which.'
    tags:
    - tag: scope
      value: availability
    manual_close: 'YES'
  - uuid: 89776dfd083b46a5ac5f6cb0d1c4fbca
    expression: '{$CPE.UPTIME.ALERT}=1 and ((last(/MDP Network Base SNMP/system.hw.uptime)>0 and last(/MDP Network Base SNMP/system.hw.uptime)<{$CPE.UPTIME.MIN}) or (last(/MDP Network Base SNMP/system.hw.uptime)=0
      and last(/MDP Network Base SNMP/system.net.uptime)<{$CPE.UPTIME.MIN}))'
    name: CPE uptime below {$CPE.UPTIME.MIN}
    priority: WARNING
    description: The endpoint CPE restarted less than {$CPE.UPTIME.MIN} ago (power, PoE or crash). It clears by itself once the CPE has run {$CPE.UPTIME.MIN} without a restart.
    tags:
    - tag: scope
      value: availability
  - uuid: 1a001347fcb540c08928edb1e24fa321
    expression: count(/MDP Network Base SNMP/icmpping,30m,"eq","0")>=3 and min(/MDP Network Base SNMP/icmpping,2m)=1 and nodata(/MDP Network Base SNMP/system.hw.uptime,3m)=0 and ((last(/MDP Network Base
      SNMP/system.hw.uptime)>0 and last(/MDP Network Base SNMP/system.hw.uptime)>30m) or (last(/MDP Network Base SNMP/system.hw.uptime)=0 and last(/MDP Network Base SNMP/system.net.uptime)>30m))
    name: 'Outage cause: CONNECTIVITY (device did not reboot)'
    priority: AVERAGE
    description: 'The device was unreachable in the last 30 minutes but its uptime did not reset, so it kept power the whole time. The fault is on the path: upstream link, radio/RF, cable or switch port.
      Check the parent device and the RCA report.'
    tags:
    - tag: scope
      value: availability
    - tag: diagnosis
      value: connectivity
    manual_close: 'YES'
  - uuid: f8ed6d7c8ed3479094eb3169fdd916e4
    expression: count(/MDP Network Base SNMP/icmpping,30m,"eq","0")>=3 and min(/MDP Network Base SNMP/icmpping,2m)=1 and nodata(/MDP Network Base SNMP/system.hw.uptime,3m)=0 and ((last(/MDP Network Base
      SNMP/system.hw.uptime)>0 and last(/MDP Network Base SNMP/system.hw.uptime)<30m) or (last(/MDP Network Base SNMP/system.hw.uptime)=0 and last(/MDP Network Base SNMP/system.net.uptime)<30m))
    name: 'Outage cause: POWER (device rebooted)'
    priority: AVERAGE
    description: The device was unreachable and came back with a fresh uptime, so it lost power or rebooted (mains, UPS, PoE port or crash). If several devices at the site show this together, it was site
      power.
    tags:
    - tag: scope
      value: availability
    - tag: diagnosis
      value: power
    manual_close: 'YES'
  - uuid: 4ff16e7602bf4506aa61a268083ce298
    expression: '{$SNMP.ALERT}=1 and max(/MDP Network Base SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0 and last(/MDP Network Base SNMP/icmpping)=1'
    name: SNMP not responding while ping is up
    priority: WARNING
    description: 'Device answers ping but not SNMP: check community, ACL or agent. Devices without SNMP (e.g. power units) have {$SNMP.ALERT}=0 and are watched by ping only.'
    tags:
    - tag: scope
      value: availability
  - uuid: ac9aeffb076e440eb1f273c271ceac98
    expression: last(/MDP Cambium ePMP SNMP/wifi.mode)=2 and max(/MDP Cambium ePMP SNMP/wifi.link.state,{$WIFI.LINK.DOWN})<3
    name: Radio not linked to its AP (scanning)
    priority: HIGH
    description: The SM answers on the network but its radio link has not been connected for {$WIFI.LINK.DOWN}. Usually the AP is down, the link is blocked or the radio was re-aimed.
    tags:
    - tag: scope
      value: availability
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/MDP Cambium ePMP SNMP/wifi.link.state)=3
  - uuid: 3718b539acd74b67b06bc8b5fe4de04b
    expression: last(/MDP Cambium ePMP SNMP/wifi.mode)=2 and max(/MDP Cambium ePMP SNMP/wifi.rssi,15m)<{$WIFI.RSSI.MIN} and min(/MDP Cambium ePMP SNMP/wifi.link.state,15m)=3
    name: 'Signal weak: RSSI {ITEM.LASTVALUE2}'
    priority: WARNING
    description: 'Signal to its own AP below {$WIFI.RSSI.MIN} dBm for 15 minutes while linked: alignment, obstruction or interference.'
    tags:
    - tag: scope
      value: performance
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: min(/MDP Cambium ePMP SNMP/wifi.rssi,10m)>={$WIFI.RSSI.MIN}+3 or last(/MDP Cambium ePMP SNMP/wifi.link.state)<>3
  - uuid: aa663542c80c4cbb9715044af19fa000
    expression: last(/MDP Cambium ePMP SNMP/wifi.mode)=2 and max(/MDP Cambium ePMP SNMP/wifi.snr,15m)<{$WIFI.SNR.MIN} and min(/MDP Cambium ePMP SNMP/wifi.link.state,15m)=3
    name: 'SNR low: {ITEM.LASTVALUE2}'
    priority: WARNING
    description: 'Signal-to-noise below {$WIFI.SNR.MIN} dB for 15 minutes while linked: interference or noise on the channel.'
    tags:
    - tag: scope
      value: performance
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: min(/MDP Cambium ePMP SNMP/wifi.snr,10m)>={$WIFI.SNR.MIN}+2 or last(/MDP Cambium ePMP SNMP/wifi.link.state)<>3
  - uuid: c6460aa56fcc4e53bbe6488c7e9e8d9d
    expression: last(/MDP Cambium ePMP SNMP/wifi.mode)=1 and max(/MDP Cambium ePMP SNMP/wifi.stations,5m)=0 and max(/MDP Cambium ePMP SNMP/wifi.stations,2h)>0
    name: AP lost all its stations
    priority: AVERAGE
    description: This AP had stations connected in the last 2 hours and now has none.
    tags:
    - tag: scope
      value: availability
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/MDP Cambium ePMP SNMP/wifi.stations)>0
  - uuid: 7634a645f2874242b32e640fb6c07e0b
    expression: last(/MDP UPS SNMP/ups.battery.charge)<{$UPS.CHARGE.MIN} and last(/MDP UPS SNMP/ups.output.source)=5
    name: 'UPS: Battery charge below {$UPS.CHARGE.MIN}% on battery'
    priority: AVERAGE
    description: Devices at the site will lose power soon.
    tags:
    - tag: scope
      value: availability
  - uuid: ee43bbfefab6423da2a6dda0f5420dbc
    expression: last(/MDP UPS SNMP/ups.battery.minutes)<{$UPS.RUNTIME.MIN} and last(/MDP UPS SNMP/ups.output.source)=5
    name: 'UPS: Runtime below {$UPS.RUNTIME.MIN} minutes on battery'
    priority: AVERAGE
    tags:
    - tag: scope
      value: availability
  - uuid: 383ce28057af47b58a53ee27d991fed6
    expression: last(/MDP Site Status/site.mainlink.up)=0 and last(/MDP Site Status/site.devices.down.pct)>={$SITE.DOWN.PCT} and {$SITE.DISASTER}=0
    name: 'Site {$SITE.CODE} DOWN: main link {$SITE.MAINLINK} lost{$SITE.CUTOFF}'
    priority: HIGH
    description: 'The site''s main link has not answered ping for {$SITE.DOWN.TIME} and most of the site''s devices are down with it, so the whole site is cut off. The device alarms at this site and the
      sites behind it are held back: this is the one problem to work on. Open the RCA report for the cause (power: the far-end radio rebooted; link: it kept its uptime).'
    tags:
    - tag: scope
      value: availability
    - tag: alarm
      value: site-down
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/MDP Site Status/site.mainlink.up)=1
    event_name: 'Site {$SITE.CODE} DOWN: main link {$SITE.MAINLINK} lost, {?last(//site.devices.down)} of {?last(//site.devices)} devices down{$SITE.CUTOFF}'
    opdata: '{ITEM.LASTVALUE2} of devices down'
  - uuid: c10e2403b35245eba940ee3ac32c7491
    expression: last(/MDP Site Status/site.mainlink.up)=0 and last(/MDP Site Status/site.devices.down.pct)>={$SITE.DOWN.PCT} and {$SITE.DISASTER}=1
    name: 'Site {$SITE.CODE} DOWN: main link {$SITE.MAINLINK} lost{$SITE.CUTOFF}'
    priority: DISASTER
    description: 'The site''s main link has not answered ping for {$SITE.DOWN.TIME} and most of the site''s devices are down with it, so the whole site is cut off. The device alarms at this site and the
      sites behind it are held back: this is the one problem to work on. Open the RCA report for the cause (power: the far-end radio rebooted; link: it kept its uptime).'
    tags:
    - tag: scope
      value: availability
    - tag: alarm
      value: site-down
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/MDP Site Status/site.mainlink.up)=1
    event_name: 'Site {$SITE.CODE} DOWN: main link {$SITE.MAINLINK} lost, {?last(//site.devices.down)} of {?last(//site.devices)} devices down{$SITE.CUTOFF}'
    opdata: '{ITEM.LASTVALUE2} of devices down'
  - uuid: d1160fc7821a4b4589b461a2cd2d1a8b
    expression: last(/MDP Site Status/site.upstream.down)>=1 and last(/MDP Site Status/site.mainlink.up)=0 and last(/MDP Site Status/site.devices.down.pct)>={$SITE.DOWN.PCT}
    name: Site {$SITE.CODE} DOWN via upstream {$SITE.UPSTREAM} (cut off, not the cause)
    priority: HIGH
    description: This site is down because the site it hangs off ({$SITE.UPSTREAM}) lost its main link. Work on the upstream Site DOWN alarm; this one clears by itself when the path comes back. If it turns
      into a 'Site DOWN' alarm after the upstream recovers, this site has its own fault too.
    tags:
    - tag: scope
      value: availability
    - tag: alarm
      value: site-cutoff
    recovery_mode: RECOVERY_EXPRESSION
    recovery_expression: last(/MDP Site Status/site.upstream.down)=0 or last(/MDP Site Status/site.mainlink.up)=1
    event_name: 'Site {$SITE.CODE} DOWN via upstream {$SITE.UPSTREAM}: cut off, {?last(//site.devices.down)} of {?last(//site.devices)} devices down'
