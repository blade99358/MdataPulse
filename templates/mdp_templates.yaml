      delay: 1h
      history: '{$RCA.HISTORY}'
      units: MHz
      tags:
      - tag: component
        value: wireless
    discovery_rules:
    - uuid: 68afb541e7da4a8f9749f32237e62d6e
      name: Wave peers discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#PEER},1.3.6.1.4.1.41112.1.11.1.3.1.14,{#PEERMODEL},1.3.6.1.4.1.41112.1.11.1.3.1.13]
      key: wave.peer.discovery
      delay: 10m
      lifetime: 7d
      item_prototypes:
      - uuid: 0fdc4dc40fc34a2a9c9b5ef94ac7dd23
        name: 'Link to {#PEER}: Local signal'
