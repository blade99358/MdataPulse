        tags:
        - tag: component
          value: wireless
        - tag: rca
          value: mcs
      - uuid: 86f632cdc0224123bdbb64cb4fc3e8bc
        name: 'Link to {#PEER}: TX capacity'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.41112.1.11.1.3.1.7.{#SNMPINDEX}]
        key: wifi.capacity.tx[{#SNMPINDEX}]
        delay: '{$WIFI.INTERVAL}'
        history: '{$RCA.HISTORY}'
        value_type: UNSIGNED
        units: bps
        tags:
        - tag: component
          value: wireless
        preprocessing:
        - type: MULTIPLIER
          parameters:
